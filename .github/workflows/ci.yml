name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Unit tests use a scripted ChatModel, so no API keys are needed here. Testcontainers
      # starts pgvector for the integration test using the runner's Docker daemon.
      - name: Build and test
        run: ./mvnw -B verify
